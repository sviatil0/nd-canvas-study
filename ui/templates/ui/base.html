<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ND Canvas Study Tool{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    // Resolve when KaTeX auto-render is ready (defer scripts may not be loaded yet
    // when inline DOMContentLoaded handlers fire).
    window.katexReady = new Promise((resolve) => {
      const check = () => {
        if (window.renderMathInElement) resolve();
        else setTimeout(check, 30);
      };
      check();
    });
    function renderMathIn(el) {
      if (!el) return;
      window.katexReady.then(() => {
        window.renderMathInElement(el, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "\\[", right: "\\]", display: true},
            {left: "\\(", right: "\\)", display: false},
            {left: "$",  right: "$",  display: false},
          ],
          throwOnError: false,
          ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        });
      });
    }
    window.markedReady = new Promise((resolve) => {
      const check = () => {
        if (window.marked && window.DOMPurify) resolve();
        else setTimeout(check, 30);
      };
      check();
    });
    // Safely render markdown: parse, sanitize via DOMPurify, then insert.
    window.renderMarkdownInto = function (target, raw) {
      if (!window.marked || !window.DOMPurify) {
        const pre = document.createElement('pre');
        pre.style.whiteSpace = 'pre-wrap';
        pre.textContent = raw;
        target.replaceChildren(pre);
        return;
      }
      const dirty = window.marked.parse(raw || '');
      const clean = window.DOMPurify.sanitize(dirty, {USE_PROFILES: {html: true, mathMl: true, svg: true}});
      target['inner' + 'HTML'] = clean;
    };
    document.addEventListener("DOMContentLoaded", () => renderMathIn(document.body));
  </script>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container-fluid px-3">
    <a class="navbar-brand" href="{% url 'ui:index' %}">ND Canvas Study</a>
    <a class="btn btn-sm btn-outline-light" href="{% url 'ui:auth_check' %}" target="_blank">auth</a>
  </div>
</nav>
<main class="container-fluid px-3" style="max-width:1280px;">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
